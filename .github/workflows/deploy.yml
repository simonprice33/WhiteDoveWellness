name: Build, Test & Deploy

# Production-only pipeline (there is no dev site). A merge/push to main builds the React frontend,
# checks the backend, then deploys to the live site on this server's self-hosted runner.
# PRs only run build-and-test so the required status check can report.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: whitedove-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'deploy' }}
  cancel-in-progress: false

jobs:
  build-and-test:
    runs-on: [self-hosted, Windows, whitedove]
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install backend dependencies
        working-directory: backend
        run: npm install --no-audit --no-fund

      - name: Check backend syntax
        working-directory: backend
        run: |
          Get-ChildItem -Recurse -Filter *.js -Path . |
            Where-Object { $_.FullName -notmatch '\\(node_modules|daemon)\\' } |
            ForEach-Object { node --check $_.FullName; if ($LASTEXITCODE -ne 0) { throw "Syntax error in $($_.FullName)" } }

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: Build frontend
        working-directory: frontend
        env:
          CI: 'false'
          REACT_APP_BACKEND_URL: https://www.whitedovewellness.co.uk
        run: npm run build

      - name: Stage build output on the runner (no cloud artifact)
        shell: pwsh
        run: |
          $src = "frontend\build"
          $dst = "C:\actions-artifacts\${{ github.event.repository.name }}\${{ github.run_id }}\frontend-build"
          if (-not (Test-Path $src)) { throw "Build output not found: $src" }
          New-Item -ItemType Directory -Force $dst | Out-Null
          robocopy $src $dst /E /NFL /NDL /NJH /NJS /NP | Out-Null
          if ($LASTEXITCODE -ge 8) { throw "robocopy failed ($LASTEXITCODE)" }
          # keep only the 5 most recent runs
          Get-ChildItem (Split-Path (Split-Path $dst)) -Directory -ErrorAction SilentlyContinue | Sort-Object CreationTime -Descending | Select-Object -Skip 5 | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          exit 0

  deploy:
    needs: build-and-test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, Windows, whitedove]
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    env:
      SITE_ROOT: C:\Sites\whitedovewellness.co.uk
    steps:
      - uses: actions/checkout@v4

      - name: Fetch build output from the runner (no cloud artifact)
        shell: pwsh
        run: |
          $src = "C:\actions-artifacts\${{ github.event.repository.name }}\${{ github.run_id }}\frontend-build"
          $dst = "${{ runner.temp }}\frontend-build"
          if (-not (Test-Path $src)) { throw "Build output not found: $src" }
          New-Item -ItemType Directory -Force $dst | Out-Null
          robocopy $src $dst /E /NFL /NDL /NJH /NJS /NP | Out-Null
          if ($LASTEXITCODE -ge 8) { throw "robocopy failed ($LASTEXITCODE)" }
          exit 0

      - name: Deploy to production
        run: .github/scripts/deploy.ps1 -RepoRoot "$env:GITHUB_WORKSPACE" -BuildDir "${{ runner.temp }}/frontend-build" -SiteRoot "$env:SITE_ROOT"

      - name: Smoke test
        run: |
          $api = Invoke-WebRequest -Uri 'http://127.0.0.1:3003/api/health' -UseBasicParsing -TimeoutSec 30
          if ($api.StatusCode -ne 200) { throw "API health returned $($api.StatusCode)" }
          $site = Invoke-WebRequest -Uri 'https://www.whitedovewellness.co.uk/' -UseBasicParsing -TimeoutSec 30
          if ($site.StatusCode -ne 200) { throw "Site returned $($site.StatusCode)" }
